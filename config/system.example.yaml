schema_version: 1
timezone: Asia/Shanghai

runtime:
  mode: production
  data_root: runtime/data
  log_root: runtime/logs
  database_path: runtime/state/signal.db
  market_request_concurrency: 8

analysis:
  interval_minutes: 30
  top_candidates: 5
  max_strong_signals: 2
  primary_signal_count: 2
  model: gpt-5.6-terra
  reasoning_effort: medium
  timeout_seconds: 300
  max_attempts: 2
  monitoring_review_repair_attempts: 3
  tool_protocol_enabled: true
  max_tool_rounds: 2
  max_tool_calls: 8
  tool_timeout_seconds: 12
  strategy_version: ultrashort-v5
  prompt_version: signal-analysis-v9

bybit:
  rest_base_url: https://api.bybit.com
  public_linear_ws_url: wss://stream.bybit.com/v5/public/linear

public_sources:
  cross_exchange_enabled: true
  binance_futures_base_url: https://fapi.binance.com
  okx_base_url: https://www.okx.com

scanner:
  preselect_limit: 60
  candle_limit: 72
  request_concurrency: 8
  minimum_24h_turnover_usdt: 1500000
  minimum_recent_30m_turnover_usdt: 50000
  maximum_spread_bps: 25
  minimum_completed_candles: 48
  maximum_missing_intervals: 2
  minimum_median_range_percent: 0.15
  minimum_max_return_percent: 0.35
  depth_check_limit: 20
  thin_depth_notional_usdt: 5000
  choppy_overlap_ratio: 0.72
  impact_extension_atr: 2.5
  minimum_tradability_score: 18

monitoring:
  enabled: true
  soft_model_wakes_per_hour: 10
  directive_refresh_seconds: 30
  reconnect_delay_seconds: 5
  maximum_directives_per_symbol: 3
  microstructure_confirmation_seconds: 3

freshness:
  enabled: true

telegram:
  enabled: false
  allowed_chat_ids: []
  allowed_user_ids: []
  api_base_url: https://api.telegram.org
  polling_timeout_seconds: 25
  delivery_enabled: true
