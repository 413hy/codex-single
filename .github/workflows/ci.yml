name: Debian verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  debian-13:
    runs-on: ubuntu-latest
    container: debian:13-slim
    timeout-minutes: 20

    steps:
      - name: Install Debian prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-dev python3-venv build-essential systemd

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install locked Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -c requirements-debian.lock.txt '.[dev]'
          .venv/bin/python -m pip check

      - name: Run code quality and tests
        run: |
          .venv/bin/python -m ruff check .
          .venv/bin/python -m mypy src tests
          .venv/bin/python -m pytest -q
          .venv/bin/python -m compileall -q src
          .venv/bin/python -m bybit_signal config-check --config config/system.example.yaml

      - name: Verify systemd unit
        run: |
          useradd --create-home --shell /bin/bash bybit-signal
          mkdir -p runtime /home/bybit-signal/.codex
          cp .env.example .env
          cp config/system.example.yaml config/system.local.yaml
          ln -s "$GITHUB_WORKSPACE" /opt/bybit-signal
          systemd-analyze verify deploy/systemd/bybit-signal.service
