[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bybit-longtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
bybit-longtime = "longtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
longtime = ["vendor/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
